workflows:
  ios-sideloadly:
    name: iOS Build for Sideloadly (No Developer Account)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Check Flutter version
        script: |
          flutter --version

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Clean old builds
        script: |
          flutter clean
          flutter pub get

      - name: Generate iOS platform files
        script: |
          flutter precache --ios

      - name: Set minimum iOS version
        script: |
          if [ -f ios/Podfile ]; then
            sed -i '' "s/platform :ios, '11.0'/platform :ios, '13.0'/g" ios/Podfile || true
            sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/g" ios/Podfile || true
          fi

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install
          cd ..

      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign

      - name: Create IPA for Sideloadly
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app

          cd Payload
          zip -r ../cosmo_leak_tester.ipa Runner.app
          cd ..

          mkdir -p build/ios/ipa
          mv cosmo_leak_tester.ipa build/ios/ipa/

          echo "✅ IPA created successfully"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - your-email@example.com
